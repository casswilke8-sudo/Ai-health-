<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nourish & Move — AI Wellness Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#faf7f2;color:#2a2a2a;min-height:100vh}
header{background:#2a2a2a;padding:16px 24px;display:flex;align-items:center;gap:10px}
.leaf{width:22px;height:22px;background:#7a9e7e;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
header h1{color:white;font-family:Georgia,serif;font-size:1.1rem;font-weight:400}
.hero{background:linear-gradient(135deg,#2a2a2a,#3d3530);color:white;padding:40px 24px;text-align:center}
.hero h2{font-family:Georgia,serif;font-size:2rem;font-weight:400;margin-bottom:12px}
.hero h2 span{color:#c4d9c6}
.hero p{color:rgba(255,255,255,0.6);font-size:0.9rem;max-width:380px;margin:0 auto}
main{max-width:640px;margin:0 auto;padding:28px 16px 80px}
.card{background:white;border-radius:14px;padding:28px 24px;box-shadow:0 2px 16px rgba(0,0,0,0.07)}
.sec{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.12em;color:#7a9e7e;font-weight:600;margin-bottom:16px}
label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px}
input,textarea{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:8px;font-family:inherit;font-size:0.875rem;background:#f8f7f4;outline:none}
textarea{resize:vertical;min-height:64px}
.field{margin-bottom:16px}
hr{border:none;border-top:1px solid #eee;margin:18px 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{padding:6px 14px;border-radius:100px;border:1.5px solid #ddd;background:#f8f7f4;font-size:0.78rem;cursor:pointer;font-family:inherit}
.pill.on{background:#7a9e7e;border-color:#7a9e7e;color:white}
.btn{width:100%;padding:15px;background:#2a2a2a;color:white;border:none;border-radius:10px;font-family:inherit;font-size:0.95rem;font-weight:500;cursor:pointer;margin-top:8px}
.err{background:#fff0ec;border:1px solid #f4c3b3;color:#8b3a1f;border-radius:8px;padding:12px 16px;font-size:0.825rem;margin-bottom:16px;display:none}
.loading{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}
.spinner{width:44px;height:44px;border:3px solid #c4d9c6;border-top-color:#7a9e7e;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading h3{font-family:Georgia,serif;font-weight:400;margin-bottom:8px}
.loading p{color:#888;font-size:0.875rem}
.results{display:none}
.results-header{background:#2a2a2a;color:white;border-radius:14px 14px 0 0;padding:20px 24px}
.results-header h3{font-family:Georgia,serif;font-weight:400;font-size:1.3rem}
.results-header p{color:#c4d9c6;font-size:0.75rem;margin-top:4px}
.tabs{display:flex;background:white;border-bottom:1px solid #eee}
.tab{flex:1;padding:13px 4px;background:none;border:none;border-bottom:2px solid transparent;font-family:inherit;font-size:0.8rem;font-weight:500;color:#888;cursor:pointer}
.tab.on{color:#2a2a2a;border-bottom-color:#7a9e7e}
.tab-body{background:white;border-radius:0 0 14px 14px;padding:24px 28px;font-size:0.875rem;line-height:2;white-space:pre-wrap;color:#2a2a2a;min-height:200px}
.restart{margin-top:20px;padding:10px 24px;border:1.5px solid #2a2a2a;border-radius:100px;background:none;font-family:inherit;font-size:0.825rem;cursor:pointer}
</style>
</head>
<body>
<header><div class="leaf"></div><h1>Nourish & Move</h1></header>
<div class="hero">
  <h2>Your body. <span>Your plan.</span></h2>
  <p>Fill in your details and get a personalized meal plan and workout routine instantly.</p>
</div>

<main>
  <!-- FORM -->
  <div class="card" id="formCard">
    <p class="sec">Your Goals</p>
    <div class="field"><label>Goal weight and body type *</label><input id="goalWeight" placeholder="e.g. 120 lbs, curvy / slim / athletic…"/></div>
    <div class="field"><label>Specific health goals *</label><textarea id="healthGoals" placeholder="e.g. lose 20 lbs, build muscle, more energy…"></textarea></div>
    <hr/>
    <p class="sec">Health Background</p>
    <div class="field"><label>Medical history / allergies</label><textarea id="medicalHistory" placeholder="e.g. allergic to honey, nut allergy, diabetes…"></textarea></div>
    <div class="field"><label>Digestive issues</label><textarea id="digestiveIssues" placeholder="e.g. bloating, IBS, acid reflux…"></textarea></div>
    <hr/>
    <p class="sec">Lifestyle</p>
    <div class="field"><label>Daily schedule</label><textarea id="dailySchedule" placeholder="e.g. 9–5 desk job, stay-at-home parent…"></textarea></div>
    <div class="field"><label>Meal prep routine</label><textarea id="mealPrep" placeholder="e.g. cook on Sundays, no time to cook…"></textarea></div>
    <hr/>
    <p class="sec">Diet & Budget</p>
    <div class="field">
      <label>Dietary pattern</label>
      <div class="pills" id="pills">
        <button class="pill" onclick="togglePill(this)">No restrictions</button>
        <button class="pill" onclick="togglePill(this)">Vegetarian</button>
        <button class="pill" onclick="togglePill(this)">Vegan</button>
        <button class="pill" onclick="togglePill(this)">Gluten-free</button>
        <button class="pill" onclick="togglePill(this)">Halal</button>
        <button class="pill" onclick="togglePill(this)">Kosher</button>
        <button class="pill" onclick="togglePill(this)">Keto</button>
        <button class="pill" onclick="togglePill(this)">Paleo</button>
      </div>
    </div>
    <div class="field"><label>Weekly grocery budget</label><input id="groceryBudget" placeholder="e.g. $75/week, $150/week…"/></div>
    <div class="err" id="errMsg"></div>
    <button class="btn" onclick="generate()">Generate My Plan →</button>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loadingDiv">
    <div class="spinner"></div>
    <h3>Building your plan…</h3>
    <p>Just a moment</p>
  </div>

  <!-- RESULTS -->
  <div class="results" id="resultsDiv">
    <div class="results-header">
      <h3>Your Wellness Plan ✨</h3>
      <p id="resultsSubtitle"></p>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="switchTab('meal',this)">🥗 Meal Plan</button>
      <button class="tab" onclick="switchTab('workout',this)">💪 Workout</button>
      <button class="tab" onclick="switchTab('tips',this)">✨ Tips</button>
    </div>
    <div class="tab-body" id="tabBody"></div>
    <button class="restart" onclick="restart()">← Start over</button>
  </div>
</main>

<script>
var plans = {};

var MEAL = `7-DAY MEAL PLAN
(~1,400–1,600 calories/day for weight loss)

MONDAY
• Breakfast: 2 scrambled eggs + spinach + herbal tea
• Lunch: Grilled chicken breast + quinoa + steamed zucchini
• Dinner: Baked salmon + roasted sweet potato + green beans
• Snack: Rice cakes + almond butter

TUESDAY
• Breakfast: Oatmeal + blueberries + cinnamon
• Lunch: Turkey lettuce wraps + sliced cucumber
• Dinner: Stir-fry chicken + bok choy + brown rice
• Snack: Hard boiled egg + baby carrots

WEDNESDAY
• Breakfast: Greek yogurt (plain) + strawberries
• Lunch: Tuna + olive oil + lemon on rice crackers
• Dinner: Ground turkey taco bowl — rice, salsa, avocado, romaine
• Snack: Handful of walnuts

THURSDAY
• Breakfast: Smoothie — spinach, banana, almond milk, protein powder
• Lunch: Lentil soup (low sodium)
• Dinner: Baked chicken thighs + roasted carrots + mashed cauliflower
• Snack: Apple slices + peanut butter

FRIDAY
• Breakfast: 2 eggs + sautéed kale + whole grain toast
• Lunch: Grilled shrimp salad — romaine, cucumber, olive oil dressing
• Dinner: Turkey meatballs + zucchini noodles + marinara
• Snack: Plain rice cakes

SATURDAY
• Breakfast: Veggie omelette (peppers, spinach, mushrooms)
• Lunch: Chicken and veggie soup
• Dinner: Baked cod + steamed broccoli + quinoa
• Snack: Celery + almond butter

SUNDAY
• Breakfast: Oatmeal + banana + chia seeds
• Lunch: Turkey and avocado wrap (corn tortilla)
• Dinner: Grilled salmon + asparagus + brown rice
• Snack: Hard boiled egg

BLOAT-BUSTING RULES:
✓ Avoid carbonated drinks, raw onions, chewing gum
✓ Peppermint tea after meals helps digestion
✓ Eat slowly and chew thoroughly
✓ No honey — check labels on granola bars, teas, dressings`;

var WORKOUT = `WEEKLY WORKOUT ROUTINE
(3–5 days/week, no gym required)

MONDAY — Full Body Strength (40 min)
• Squats — 3 sets × 12 reps
• Lunges — 3 sets × 10 each leg
• Push-ups — 3 sets × 10
• Dumbbell rows — 3 sets × 12
• Plank — 3 × 30 seconds

TUESDAY — Cardio (30 min)
• Brisk walk, jog, or cycling
• Keep heart rate at 60–70% of max
• Finish with 5 min cool-down stretch

WEDNESDAY — Rest or light yoga/stretching

THURSDAY — Lower Body (40 min)
• Sumo squats — 3 × 15
• Glute bridges — 3 × 15
• Step-ups — 3 × 10 each leg
• Calf raises — 3 × 20
• Side-lying leg raises — 3 × 15

FRIDAY — Cardio + Core (35 min)
• 20 min brisk walk or jog
• Crunches — 3 × 15
• Bicycle crunches — 3 × 15
• Leg raises — 3 × 12
• Dead bug — 3 × 10

SATURDAY — Upper Body (35 min)
• Dumbbell shoulder press — 3 × 12
• Bicep curls — 3 × 12
• Tricep dips — 3 × 12
• Chest press — 3 × 12
• Bent-over rows — 3 × 12

SUNDAY — Rest or 20 min walk

At 1–1.5 lbs/week you'll reach your goal in roughly 14–20 weeks.`;

var TIPS = `TIPS & HABITS FOR SUCCESS

NUTRITION
• Drink 16 oz of water before every meal
• Never skip breakfast — stabilizes blood sugar
• Prep proteins and grains on Sunday
• Always read labels — honey hides in granola bars, teas, dressings, sauces

DIGESTION
• Eat slowly and chew each bite thoroughly
• Peppermint or ginger tea after meals soothes bloating
• Avoid raw onions, carbonated drinks, and gum
• Keep a food journal for 2 weeks to find your bloat triggers

FITNESS
• Start with 3 workout days/week and build up
• Walk 10 min after dinner — burns calories and aids digestion
• Stretch 5 min before bed to reduce soreness

MINDSET
• Weigh yourself once a week, same day and time
• Track meals in MyFitnessPal for the first month
• Sleep 7–8 hours — poor sleep raises hunger hormones
• Take progress photos every 2 weeks`;

function togglePill(el){
  if(el.textContent==='No restrictions'){
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
    el.classList.add('on');
  } else {
    document.querySelector('.pill').classList.remove('on');
    el.classList.toggle('on');
  }
}

function getDiet(){
  var selected=[...document.querySelectorAll('.pill.on')].map(p=>p.textContent);
  return selected.length?selected.join(', '):'No restrictions';
}

function generate(){
  var gw=document.getElementById('goalWeight').value.trim();
  var hg=document.getElementById('healthGoals').value.trim();
  if(!gw||!hg){
    var e=document.getElementById('errMsg');
    e.textContent='Please fill in your goal weight and health goals.';
    e.style.display='block'; return;
  }
  document.getElementById('errMsg').style.display='none';
  document.getElementById('formCard').style.display='none';
  document.getElementById('loadingDiv').style.display='flex';

  setTimeout(function(){
    var meal=MEAL, workout=WORKOUT, tips=TIPS;
    var med=document.getElementById('medicalHistory').value.toLowerCase();
    var dig=document.getElementById('digestiveIssues').value.toLowerCase();
    var diet=getDiet().toLowerCase();

    if(med.includes('honey')) tips='⚠️ HONEY ALLERGY: Strictly avoid honey — it hides in granola bars, energy bars, teas, dressings, and sauces. Always read every label.\n\n'+tips;
    if(med.includes('nut')||med.includes('almond')){
      meal=meal.replace(/almond butter/g,'sunflower seed butter').replace(/walnuts/g,'pumpkin seeds').replace(/peanut butter/g,'sunflower seed butter');
    }
    if(dig.includes('bloat')) tips='⚠️ BLOATING FOCUS: Your plan prioritizes anti-bloat foods throughout.\n\n'+tips;
    if(diet.includes('vegan')){
      meal=meal.replace(/chicken breast/g,'tofu').replace(/salmon/g,'tempeh').replace(/turkey/g,'lentils').replace(/tuna/g,'chickpeas').replace(/2 scrambled eggs/g,'tofu scramble').replace(/Greek yogurt \(plain\)/g,'coconut yogurt').replace(/Hard boiled egg/g,'Edamame');
    } else if(diet.includes('vegetarian')){
      meal=meal.replace(/Grilled chicken breast/g,'Grilled tofu').replace(/Ground turkey/g,'Lentil').replace(/turkey/g,'lentil').replace(/Tuna/g,'Chickpea salad').replace(/shrimp/g,'halloumi').replace(/cod/g,'tempeh');
    }

    plans={meal:meal,workout:workout,tips:tips};
    document.getElementById('resultsSubtitle').textContent='Goal: '+hg.slice(0,50);
    document.getElementById('tabBody').textContent=meal;
    document.getElementById('loadingDiv').style.display='none';
    document.getElementById('resultsDiv').style.display='block';
  },1800);
}

function switchTab(key,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tabBody').textContent=plans[key]||'';
}

function restart(){
  document.getElementById('resultsDiv').style.display='none';
  document.getElementById('formCard').style.display='block';
}
</script>
</body>
</html>
